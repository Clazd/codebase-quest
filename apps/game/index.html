<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codebase Quest</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1b24;
        color: #e8e6e3;
        font-family: system-ui, sans-serif;
      }
      body,
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #game canvas {
        image-rendering: pixelated;
      }
      .hint {
        margin: 0;
        font-size: 14px;
        opacity: 0.85;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Codebase Quest</h1>
      <div id="game" role="application" aria-label="Game: test scene. Move with the arrow keys or W A S D."></div>
      <p class="hint">Test scene · move with the arrow keys or WASD</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
